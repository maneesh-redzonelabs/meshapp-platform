services:
  # Backend API — Node.js/Express/Prisma. Built from the repo root so the
  # @meshapp/shared npm workspace dependency resolves correctly (it is not
  # published to npm; it only exists as a workspace symlink).
  - type: web
    name: meshapp-api
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build --workspace packages/shared && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace apps/api
    startCommand: node apps/api/dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL_SECONDS
        value: 3600
      - key: JWT_REFRESH_TTL_DAYS
        value: 30
      - key: MOCK_OTP_EXPOSE
        value: "false"
      - key: OTP_LENGTH
        value: 4
      - key: OTP_TTL_MINUTES
        value: 10
      - key: OTP_MAX_ATTEMPTS
        value: 3
      - key: UPLOADS_DIR
        value: ./uploads
      - key: UPLOAD_BASE_URL
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_DEFAULT
        value: 300
      - key: IDEMPOTENCY_TTL_MINUTES
        value: 60
      - key: CORS_ORIGIN
        sync: false

  # Web client — React/Vite static site, built from the repo root for the
  # same workspace-resolution reason as the API.
  - type: web
    name: meshapp-web
    runtime: static
    buildCommand: npm install && npm run build --workspace packages/shared && npm run build --workspace apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
